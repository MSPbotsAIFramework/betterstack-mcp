# Local debug only. Credentials are supplied per-request via the
# X-Betterstack-Api-Token header (see README.md), never through environment
# variables -- do not add a token here.
services:
  betterstack-mcp:
    build: .
    ports:
      - "8080:8080"
    environment:
      MCP_HTTP_HOST: "0.0.0.0"
      MCP_HTTP_PORT: "8080"
